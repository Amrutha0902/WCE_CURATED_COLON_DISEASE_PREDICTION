name: Security regression checks
on:
  pull_request:
  push:
    branches:
      - security/wce-hardening-2026
      - security/post-audit-remediation-2026

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and vulnerability auditor
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --upgrade 'setuptools>=84.1' 'pip-audit>=2.7,<3'
      - name: Fail on known vulnerable installed dependencies
        run: python -m pip_audit --progress-spinner off

  static-security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install testing dependencies
        run: python -m pip install 'pytest>=8,<10' 'Flask>=3,<4' 'Flask-WTF>=1.2,<2' 'python-dotenv>=1.0,<2' 'Flask-Limiter>=3.8,<5' 'numpy>=1.26,<3' 'Pillow>=13,<14'
      - name: Run source safety checks
        run: python -m pytest -q tests/test_security_contract.py tests/test_flask_security.py

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-throwaway-password
          MYSQL_DATABASE: colon_disease_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-throwaway-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      WCE_MYSQL_TEST: '1'
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ci-only-throwaway-password
      DB_NAME: colon_disease_db_test
      FLASK_SECRET_KEY: github-actions-disposable-secret-not-for-production
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install integration-test dependencies
        run: python -m pip install 'pytest>=8,<10' 'Flask>=3,<4' 'Flask-WTF>=1.2,<2' 'python-dotenv>=1.0,<2' 'Flask-Limiter>=3.8,<5' 'mysql-connector-python>=9,<10' 'numpy>=1.26,<3' 'Pillow>=13,<14'
      - name: Initialize disposable MySQL schema
        env:
          MYSQL_PWD: ci-only-throwaway-password
        run: |
          sed 's/colon_disease_db/colon_disease_db_test/g' setup_database.sql | mysql -h 127.0.0.1 -uroot
      - name: Exercise real SQL queries against MySQL
        run: python -m pytest -q tests/test_mysql_integration.py

  model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KERAS_BACKEND: tensorflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real model runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install full declared application dependencies
        run: python -m pip install -r requirements.txt
      - name: Deserialize model and run single CPU inference
        run: python -m pytest -q tests/test_model_smoke.py
      - name: Import real Flask application with saved model
        env:
          FLASK_SECRET_KEY: throwaway-ci-secret-for-app-import-only-123456
          COOKIE_SECURE: 'false'
        run: python -c "import app; assert app.model is not None; print('Flask application and VGG model import succeeded')"

  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-throwaway-password
          MYSQL_DATABASE: colon_disease_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-throwaway-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      WCE_E2E_TEST: '1'
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ci-only-throwaway-password
      DB_NAME: colon_disease_db_test
      FLASK_SECRET_KEY: ci-only-throwaway-signing-key-123456789
      COOKIE_SECURE: 'false'
      KERAS_BACKEND: tensorflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Initialize disposable MySQL schema
        env:
          MYSQL_PWD: ci-only-throwaway-password
        run: |
          sed 's/colon_disease_db/colon_disease_db_test/g' setup_database.sql | mysql -h 127.0.0.1 -uroot
      - name: Test complete real model HTTP workflow
        run: python -m pytest -q tests/test_full_e2e.py

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration with dummy CI-only values
        env:
          DB_PASSWORD: disposable-ci-only
          MYSQL_ROOT_PASSWORD: disposable-ci-root
          FLASK_SECRET_KEY: disposable-ci-signing-key-not-for-production
        run: docker compose config --quiet
      - name: Build reproducible application image
        run: docker build -t wce-ci-smoke .
