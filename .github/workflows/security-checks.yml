name: Security regression checks
on:
  pull_request:
  push:
    branches:
      - security/wce-hardening-2026

jobs:
  static-security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install testing dependencies
        run: python -m pip install 'pytest>=8,<10'
      - name: Run source safety checks
        run: python -m pytest -q tests/test_security_contract.py
