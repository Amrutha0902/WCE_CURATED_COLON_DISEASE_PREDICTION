name: Security regression checks
on:
  pull_request:
  push:
    branches:
      - security/wce-hardening-2026

jobs:
  static-security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install testing dependencies
        run: python -m pip install 'pytest>=8,<10' 'Flask>=3,<4' 'Flask-WTF>=1.2,<2' 'Flask-Limiter>=3.8,<5' 'numpy>=1.26,<3' 'Pillow>=10,<13'
      - name: Run source safety checks
        run: python -m pytest -q tests/test_security_contract.py tests/test_flask_security.py
